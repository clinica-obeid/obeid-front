# Protótipo de demonstração: nenhum dado sai do navegador, mas os cabeçalhos
# abaixo evitam que a página seja embutida ou sniffada em outro contexto.
#
# Este arquivo existe porque `add_header` num `location` descarta os cabeçalhos
# herdados do `server` — então ele é incluído em cada bloco que define os seus.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options        "SAMEORIGIN" always;
add_header Referrer-Policy        "no-referrer" always;
