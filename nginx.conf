server {
  listen       8080;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  include /etc/nginx/snippets/security-headers.conf;

  # O roteamento é do vue-router em modo history: qualquer caminho que não
  # corresponda a um arquivo devolve o index.html para a aplicação resolver.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Os nomes dos assets carregam hash do conteúdo, então podem ser cacheados
  # de forma agressiva. O index.html, não — é ele que aponta para a versão nova.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
}
